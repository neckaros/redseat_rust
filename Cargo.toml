[package]
name = "redseat-rust"
version = "0.1.0"
edition = "2021"
default-run = "redseat-rust"
build = "build.rs"

[[bin]]
name = "redseat-daemon"
path = "src/daemon/main.rs"

[[bin]]
name = "redseat-rust"
path = "src/main.rs"

#[profile.test]
#inherits = "release"

[dependencies]
axum = {version = "0.7", features = ["query", "macros", "multipart"]}
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5.0", features = ["cors","trace", "normalize-path", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
serde_path_to_error = "0.1"
nanoid = "0.4.0"
http-body-util = "0.1.0"
hyper = { version = "1.0.0", features = ["full"] }
mime = "0.3"

jsonwebtoken = { version = "10", features = ["rust_crypto"] }
tower = "0.4"
dirs = "5.0.1"
clap = { version = "4.4.18", features = ["derive"] }
lazy_static = "1.4.0"
rsa = "0.9.10"
rand = "0.8.5"
instant-acme = "0.4.2"
rcgen = "0.12.1"
x509-parser = "0.16.0"
chrono = { version = "0.4.33", features = ["serde"]}
cron = "0.17.0"
reqwest = { version = "0.12.3", features = ["stream", "gzip"]}
query_external_ip = "0.1.1"
axum-server-dual-protocol = "0.7.0"

rusqlite = { version = "0.31", features = ["bundled","serde_json"] }
tokio-rusqlite = "0.5.1"
bytes = "1.11.1"
derive_more = "0.99.17"
strum_macros = "0.26.1"
tokio-util = { version = "0.7.11", features = ["compat", "io", "io-util"] }
time = "0.3.47"
tokio-stream = { version = "0.1.14", features = ["io-util"] }
async-stream = "0.3"
async-trait = "0.1.77"
mime_guess = "2.0.4"

image = { version = "0.25.5", features = ["nasm", "rayon", "avif-native"] }
webp = "0.3.1"
kamadak-exif = "0.6.1"

which = "6.0.0"
strum = "0.26.1"
futures = "0.3.30"

ndarray = "0.16.1"
ort = "2.0.0-rc.10"
ort-sys = "=2.0.0-rc.10"
nalgebra = "0.34"  # For matrix math (SVD/Least Squares)
sha2 = "0.10"
axum-extra = { version = "0.9.2", features = ["query"] }
http = "1.1.0"
extism = "1.13.0"
rs-plugin-common-interfaces = { version = "0.37.0", features = ["rusqlite",] }
async-recursion = "1.1.0"
async-compression = { version = "0.4.6", features = ["tokio"] }
youtube_dl = { version = "0.10.0", features = ["tokio", "downloader-rustls-tls"] }
stream-map-any = "0.2.2"
human_bytes = "0.4.3"
regex = "1.10.4"
unidecode = "0.3.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.22"
zip = "8.6.0"
async_zip = { version = "0.0.19", features = ["full"] }
unrar-ng = "0.7.7"
tempfile = "3.27.0"
trash = "5.0.0"
aes = "0.8.4"
cbc = "0.1.2"
ctr = "0.9.2"
hex-literal = "0.4.1"
pbkdf2 = "0.12.2"
sha1 = "0.10.6"
hex = "0.4.3"
rs_torrent_magnet = "0.3.0"
# Use the 1.23 API bindings; build.rs enforces the patched system library (>= 1.23.3).
libheif-sys = { version = "5.3.1", features = ["v1_23"] }
quickraw = { version = "0.1.6", features = ["rayon"] }
jxl-oxide = { version = "0.11.1", features = ["image"] }
sevenz-rust = "0.6.1"
flate2 = "1.0.35"
crc32fast = "1.5.0"
tar = "0.4.43"
xz2 = "0.1.7"
imageproc = "0.25.0"
urlencoding = "2.1.3"
bytemuck = { version = "1.24.0", features = ["derive"] }
ulid = "1.2.1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
hyper-util = { version = "0.1", features = ["client", "http1", "client-legacy"] }
serial_test = "*"

[build-dependencies]
pkg-config = "0.3"

[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4"
# cargo-vcpkg installs native libraries only for the selected Windows target.

[package.metadata.vcpkg.target]
# Static libraries with the dynamic MSVC runtime (/MD).
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md", dependencies = ["libheif[aom,hevc]"] }

aarch64-pc-windows-msvc = { triplet = "arm64-windows-static-md", dependencies = ["libheif[aom,hevc]"] }
